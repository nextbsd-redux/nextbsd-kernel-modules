name: Build NextBSD Modules
on:
  repository_dispatch:
    types: [kernel-updated]
  pull_request:
    # Validate the module cross-build (both arches) on PRs touching the
    # workflow. The kernel obj tree now comes from nextbsd-kernel's rolling
    # `continuous` release (always present), so a PR needs no run_id, and PR
    # runs never publish — see the publish job's `if`.
    paths:
      - '.github/workflows/build.yml'
      - 'tools/ko2kext.sh'
      - 'tests/kext-boot-test.sh'
  workflow_dispatch:
    inputs:
      fbsd_sha:
        description: 'Pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''

env:
  FREEBSD_BRANCH: releng/15.0

jobs:
  modules:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: amd64
            target_arch: amd64
          - target: arm64
            target_arch: aarch64
    container:
      # Same per-arch toolchain image the kernel was built in, so module source
      # matches. Cross-builds on the x86_64 runner (no emulation).
      image: ghcr.io/nextbsd-redux/nextbsd-kernel-toolchain:${{ matrix.target }}-${{ (github.event.client_payload.fbsd_sha || inputs.fbsd_sha) && format('fbsd-{0}', github.event.client_payload.fbsd_sha || inputs.fbsd_sha) || 'latest' }}
    steps:
      - name: Download kernel obj tree from kernel continuous release
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          mkdir -p /usr/obj
          # Pull the CI-gated kernel obj tree from nextbsd-kernel's rolling
          # `continuous` release. It's always present (only a green main build
          # refreshes it) and needs no run_id — which is what lets this build
          # run on PRs. The tarball is rooted at /usr/obj's contents, so it
          # restores the same layout the old download-artifact produced.
          gh release download continuous \
            --repo nextbsd-redux/nextbsd-kernel \
            --pattern "kernel-obj-${{ matrix.target }}.tar.gz" \
            --output /tmp/kernel-obj.tar.gz --clobber
          tar -C /usr/obj -xzf /tmp/kernel-obj.tar.gz

      # ccache: modules is mostly compilation, so this is the biggest win.
      # ccache is in the toolchain image; --cross-bindir points at its wrapper.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-modules-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ccache-modules-${{ matrix.target }}-

      - name: ccache reset counters
        run: |
          ccache -o max_size=5G
          ccache -z
          ccache -s

      - name: Apply patches to source
        run: |
          cd /usr/src
          # /usr/src in the container is the unpatched baked tree; re-apply the
          # same patches + config the kernel was built with.
          git clone --depth 1 https://github.com/nextbsd-redux/nextbsd-kernel.git /tmp/nk
          for p in $(cat /tmp/nk/patches/series); do
            echo "Applying $p"
            git apply /tmp/nk/patches/$p
          done
          cp /tmp/nk/config/NEXTBSD /usr/src/sys/${{ matrix.target }}/conf/

      - name: Build modules
        run: |
          cd /usr/src
          # --cross-bindir = ccache wrapper (cached compiles). MAKEOBJDIRPREFIX +
          # CCACHE_CROSS_BINDIR inherited from the toolchain image.
          # NO_KERNEL=yes builds modules against the already-built kernel obj.
          ./tools/build/make.py \
            --cross-bindir="${CCACHE_CROSS_BINDIR}" \
            TARGET="${{ matrix.target }}" \
            TARGET_ARCH="${{ matrix.target_arch }}" \
            KERNCONF=NEXTBSD \
            NO_KERNEL=yes \
            buildkernel -j"$(nproc)"

      - name: ccache stats (after build — hit rate is the proof)
        run: ccache -s

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextbsd-modules-${{ matrix.target }}
          path: /usr/obj/**/modules/

      - name: Create release
        if: github.event.client_payload.release == 'true'
        run: |
          cd /usr/obj
          tar czf /tmp/nextbsd-modules-${{ matrix.target }}.tar.gz $(find . -type d -name modules)
          # Per-arch tag so the two matrix legs don't collide on one release.
          gh release create "v$(date +%Y%m%d)-modules-${{ matrix.target }}" \
            /tmp/nextbsd-modules-${{ matrix.target }}.tar.gz \
            --repo nextbsd-redux/nextbsd-kernel-modules \
            --title "NextBSD Modules ${{ matrix.target }} $(date +%Y-%m-%d)" \
            --notes "Built against FreeBSD ${FREEBSD_BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # PR-only kext proof-of-concept (#183): convert a leaf .ko to a .kext and
  # prove it loads via the Apple-shaped kextload in a booted VM. Wraps nmdm.ko
  # (null-modem pseudo-tty — a dependency-free leaf, so no dep resolution is
  # needed) and boots the nextbsd `continuous` image, which must already ship
  # the kextload/kextstat/kextunload trio (nextbsd Phase 1). Mirrors the
  # nextbsd-kernel boot smoke test. PR-only, never publishes.
  kext-smoke-test:
    name: kext PoC (Nmdm.kext load/unload + IntelWiFi.kext load, in a booted VM)
    needs: modules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (tools/ + tests/)
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Download built modules (amd64)
        uses: actions/download-artifact@v4
        with:
          name: nextbsd-modules-amd64
          path: modules-dl

      - name: Convert nmdm.ko -> Nmdm.kext and if_iwlwifi.ko -> IntelWiFi.kext
        run: |
          chmod +x tools/ko2kext.sh
          # Nmdm.kext: dependency-free leaf — full load/unload canary.
          KO=$(find modules-dl -type f -name nmdm.ko | head -1)
          test -n "$KO" || { echo "nmdm.ko not found in modules artifact" >&2; find modules-dl -name '*.ko' | head; exit 1; }
          echo "==> wrapping $KO"
          tools/ko2kext.sh "$KO" Nmdm org.nextbsd.kext.nmdm
          ls -lR Nmdm.kext
          # IntelWiFi.kext: if_iwlwifi — Tier-0 real driver. Its linuxkpi /
          # linuxkpi_wlan deps are baked into the kernel (options COMPAT_LINUXKPI
          # + device wlan), so it needs no OSBundleLibraries.
          IWKO=$(find modules-dl -type f -name if_iwlwifi.ko | head -1)
          test -n "$IWKO" || { echo "if_iwlwifi.ko not found in modules artifact" >&2; find modules-dl -name 'if_*.ko' | head; exit 1; }
          # Bundle the Intel 8260 firmware (+ its license) inside the kext,
          # Apple-style, from a pinned linux-firmware tag. Intel permits
          # unmodified binary redistribution provided the licence text ships
          # alongside it, so both go into Contents/Resources/firmware. The
          # kernel finds them via the firmware_path search list (nextbsd-kernel
          # patch 0004 + the image's loader.conf). iwlwifi only fetches firmware
          # at device attach, so this is inert in the QEMU load test but is what
          # makes the driver work on real Intel 8260 hardware.
          FW_TAG=20260519
          FW_BASE="https://gitlab.com/kernel-firmware/linux-firmware/-/raw/${FW_TAG}"
          curl -fL --retry 3 -o iwlwifi-8000C-36.ucode "${FW_BASE}/intel/iwlwifi/iwlwifi-8000C-36.ucode"
          curl -fL --retry 3 -o LICENCE.iwlwifi_firmware "${FW_BASE}/LICENCE.iwlwifi_firmware"
          echo "==> wrapping $IWKO (with iwlwifi-8000C-36.ucode firmware)"
          tools/ko2kext.sh -f iwlwifi-8000C-36.ucode -f LICENCE.iwlwifi_firmware \
              "$IWKO" IntelWiFi org.nextbsd.kext.intelwifi
          ls -lR IntelWiFi.kext

      - name: Download nextbsd continuous image
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh release download continuous -R nextbsd-redux/nextbsd \
            --pattern '*.img.zip' --dir iso --clobber
          MEMBER=$(unzip -Z1 iso/*.img.zip | grep -E '\.img$' | head -1)
          [ -n "$MEMBER" ] || { echo "no .img member in published zip" >&2; exit 1; }
          unzip -p iso/*.img.zip "$MEMBER" > disk.img
          rm -rf iso
          ls -lh disk.img

      # Root is freebsd-ufs (not writable from Linux): md-attach the image,
      # mount ROOTFS, drop Nmdm.kext into /System/Library/Extensions, unmount.
      # copyback brings the mutated disk.img back to the runner.
      - name: Inject Nmdm.kext + IntelWiFi.kext into the image's UFS root
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.0'
          usesh: true
          sync: rsync
          copyback: true
          run: |
            set -eu
            md=$(mdconfig -a -t vnode -f disk.img)
            gpart show -p "$md"
            part=$(gpart show -p "$md" | awk '/freebsd-ufs/{print $3; exit}')
            [ -n "$part" ] || { echo "no freebsd-ufs partition" >&2; exit 1; }
            mkdir -p /mnt-root
            mount "/dev/$part" /mnt-root
            mkdir -p /mnt-root/System/Library/Extensions
            cp -R Nmdm.kext IntelWiFi.kext /mnt-root/System/Library/Extensions/
            # OSKext authenticates kexts: every bundle component must be
            # root:wheel and not group/other-writable (cp -R into the VM does
            # not guarantee this). This mirrors how kexts must be deployed.
            chown -R root:wheel /mnt-root/System/Library/Extensions/Nmdm.kext \
                                /mnt-root/System/Library/Extensions/IntelWiFi.kext
            chmod -R go-w /mnt-root/System/Library/Extensions/Nmdm.kext \
                          /mnt-root/System/Library/Extensions/IntelWiFi.kext
            ls -lR /mnt-root/System/Library/Extensions/
            umount /mnt-root
            mdconfig -d -u "$md"
            echo "==> Nmdm.kext + IntelWiFi.kext injected"

      - name: Install qemu + expect + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 expect ovmf

      - name: Boot test (kextload the converted kext)
        run: |
          chmod +x tests/kext-boot-test.sh
          ./tests/kext-boot-test.sh disk.img

      - name: Upload kext boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kext-boot-log
          path: tests/kext-boot.log
          if-no-files-found: ignore

  # Refresh the rolling `continuous` release from a successful main build, so
  # nextbsd ingests a stable, CI-gated module tree instead of scraping the
  # latest main run artifact. Single non-matrix job (collects both arches,
  # publishes once — no release-creation race). PRs build but never reach here.
  publish:
    name: publish continuous
    needs: modules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-arch assets
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            # nextbsd-modules-<arch>.tar.gz: the built *.ko module tree,
            # consumed by nextbsd (installs them into /boot/kernel on the ISO).
            if [ -d "artifacts/nextbsd-modules-$arch" ]; then
              tar -C "artifacts/nextbsd-modules-$arch" -czf "out/nextbsd-modules-$arch.tar.gz" .
            fi
          done
          ls -lh out/

      # Stable asset names → each publish overwrites in place; no stale pileup.
      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous modules build
          body: |
            Rolling module build, refreshed on every successful `main` build.
            Consumed by nextbsd (`nextbsd-modules-<arch>.tar.gz`).

            Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
